imports:
    - { resource: ../config/default.yml }

parameters:
    kernel.runtime_mode.web: true

framework:
    serializer: { enabled: true }

services:
    rate_limit_mapping.custom_resolver:
        class: Symfony\Bundle\FrameworkBundle\Tests\Functional\CustomRateLimitValueResolver
        tags: ['controller.targeted_value_resolver']

rate_limiter:
    limiters:
        public_a: { policy: fixed_window, limit: 9, interval: '1 hour' }
        private_a: { policy: fixed_window, limit: 2, interval: '1 hour' }
        public_b: { policy: fixed_window, limit: 4, interval: '1 hour' }
        limited: { policy: fixed_window, limit: 1, interval: '1 hour' }
        unlimited: { policy: no_limit }
        sliding: { policy: sliding_window, limit: 5, interval: '1 hour' }
        bucket: { policy: token_bucket, limit: 5, rate: { interval: '1 hour', amount: 1 } }
        combined: { policy: compound, limiters: [public_a, private_a] }
        cheap: { policy: fixed_window, limit: 100, interval: '1 hour' }
        expensive: { policy: fixed_window, limit: 100, interval: '1 hour' }
